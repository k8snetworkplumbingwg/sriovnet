on: [push, pull_request]
name: test
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.25.x

      - name: Checkout code
        uses: actions/checkout@v7

      - name: lint
        run: make lint

      - name: unit-test
        run: make test

  coverage:
    runs-on: ubuntu-latest
    name: coverage
    needs: test
    steps:
      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.25.x

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Go test with coverage
        run: make test-coverage

      - name: Coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: sriovnet.lcov

